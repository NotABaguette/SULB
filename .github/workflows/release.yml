name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist
          for t in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            read -r os arch <<< "$t"
            out="dist/sulb-$os-$arch"; [ "$os" = "windows" ] && out="$out.exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$out" ./cmd/sulb
          done
          (cd dist && shasum -a 256 * > SHA256SUMS)

      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "sulb $GITHUB_REF_NAME" --notes "Docs: docs/quickstart.md and docs/config-reference.md. Verify binaries with SHA256SUMS; set entry.tun_name: \"\" for SOCKS-only (no admin)."
        env:
          GH_TOKEN: ${{ github.token }}
